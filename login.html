<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="login-section">
    <div class="login-box">
        <form id="form-login" action="index.html">
            <h2>Login</h2>
            <div class="input-box">
                <span class="icon">👤</span>
                <input type="email" id="l-email" required>
                <label>Email</label>
            </div>
            <div class="input-box">
               <span class="icon">👤</span>
                <input type="password" id="l-pass" required>
                <label>Password</label> 
            </div>
            <p class="pesan" style="font-size:14px; margin:10px 0; text-align:center;"></p>
            <div class="remember-forgot">
                <label><input type="checkbox">Remember Me</label>
                <a href="#" id="ke-lupa">Forgot Password?</a>
            </div>
            <button type="submit">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="#" id="ke-register">Register</a></p>
            </div>
        </form>

        <!-- ===== FORM REGISTER ===== -->
        <form id="form-register" style="display:none;">
            <h2>Register</h2>
            <div class="input-box">
                <span class="icon">👤</span>
                <input type="text" id="r-nama" required>
                <label>Nama</label>
            </div>
            <div class="input-box">
                <span class="icon">✉️</span>
                <input type="email" id="r-email" required>
                <label>Email</label>
            </div>
            <div class="input-box">
                <span class="icon">🔒</span>
                <input type="password" id="r-pass" required minlength="6">
                <label>Password (min. 6 karakter)</label>
            </div>
            <div class="input-box">
                <span class="icon">🔒</span>
                <input type="password" id="r-pass2" required>
                <label>Ulangi Password</label>
            </div>
            <p class="pesan" style="font-size:14px; margin:10px 0; text-align:center;"></p>
            <button type="submit">Register</button>
            <div class="register-link">
                <p>Sudah punya akun? <a href="#" class="ke-login">Login</a></p>
            </div>
        </form>
 
        <!-- ===== FORM LUPA PASSWORD ===== -->
        <form id="form-lupa" style="display:none;">
            <h2>Reset Password</h2>
            <div class="input-box">
                <span class="icon">✉️</span>
                <input type="email" id="f-email" required>
                <label>Email terdaftar</label>
            </div>
            <div class="input-box">
                <span class="icon">🔒</span>
                <input type="password" id="f-pass" required minlength="6">
                <label>Password baru</label>
            </div>
            <p class="pesan" style="font-size:14px; margin:10px 0; text-align:center;"></p>
            <button type="submit">Simpan password baru</button>
            <div class="register-link">
                <p><a href="#" class="ke-login">Kembali ke Login</a></p>
            </div>
        </form>
 
    </div>
    </section>
 
    <script src="login.js"></script>
</body>
</html>
